name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails the build on type errors and broken content-collection schemas,
      # so a bad frontmatter field can never reach production.
      - name: Astro check
        run: npx astro check

      # `npm run build` also runs verify:migration, which fails the build if any
      # old WordPress URL is unhandled or points at a page that does not exist.
      # A redirect into a 404 is worse than no redirect at all.
      - name: Build and verify URL migration
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
